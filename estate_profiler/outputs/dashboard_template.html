<title>Estate Triage — __TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  color-scheme: light;
  --ground: #f7f7f5;
  --surface: #fcfcfb;
  --surface-sunk: #f1f1ed;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --accent: #2a78d6;

  /* Blue ordinal ramp — ordered scales only (disposition, readiness band). */
  --ord-1: #184f95;
  --ord-2: #256abf;
  --ord-3: #3987e5;
  --ord-4: #6da7ec;
  --ord-5: #86b6ef;

  /* Reserved status palette — used only where color means risk. */
  --good: #0ca30c;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --neutral-mark: #c3c2b7;

  --step-1: 4px;  --step-2: 8px;  --step-3: 12px;
  --step-4: 16px; --step-5: 24px; --step-6: 32px; --step-7: 48px;
  --radius: 10px;
  --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0d0d0d;
    --surface: #1a1a19;
    --surface-sunk: #121211;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
    --ord-1: #cde2fb;
    --ord-2: #9ec5f4;
    --ord-3: #6da7ec;
    --ord-4: #3987e5;
    --ord-5: #256abf;
    --neutral-mark: #383835;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0d0d0d;
  --surface: #1a1a19;
  --surface-sunk: #121211;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --ink-muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --accent: #3987e5;
  --ord-1: #cde2fb;
  --ord-2: #9ec5f4;
  --ord-3: #6da7ec;
  --ord-4: #3987e5;
  --ord-5: #256abf;
  --neutral-mark: #383835;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding-inline: 20px;
  padding-block: var(--step-6) var(--step-7);
  display: flex;
  flex-direction: column;
  gap: var(--step-6);
}

/* ---------- masthead ---------- */
.masthead { display: flex; flex-direction: column; gap: var(--step-3); }
.eyebrow {
  font-family: var(--display);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
}
h1 {
  font-family: var(--display);
  font-size: clamp(28px, 5vw, 40px);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.1;
  margin: 0;
  text-wrap: balance;
  overflow-wrap: anywhere;
}
.meta-rail {
  display: flex;
  flex-wrap: wrap;
  gap: var(--step-2) var(--step-5);
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink-2);
}
.meta-rail span { display: inline-flex; gap: 6px; }
.meta-rail b { color: var(--ink-muted); font-weight: 400; }

/* ---------- alert ---------- */
.alert {
  display: flex;
  gap: var(--step-3);
  align-items: flex-start;
  padding: var(--step-4);
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--critical);
}
.alert-icon { flex: none; margin-top: 1px; }
.alert-title {
  font-family: var(--display);
  font-weight: 600;
  font-size: 15px;
  display: flex;
  align-items: center;
  gap: var(--step-2);
}
.alert p { margin: var(--step-1) 0 0; color: var(--ink-2); font-size: 14px; }

/* ---------- hero ---------- */
.hero {
  display: grid;
  grid-template-columns: minmax(0, 320px) minmax(0, 1fr);
  gap: var(--step-5) var(--step-6);
  align-items: center;
  padding: var(--step-6);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.hero-figure {
  font-family: var(--display);
  font-size: clamp(56px, 11vw, 84px);
  font-weight: 700;
  line-height: 0.92;
  letter-spacing: -0.035em;
  color: var(--accent);
}
.hero-figure sup { font-size: 0.42em; font-weight: 600; top: -0.72em; margin-left: 2px; }
.hero-label {
  font-family: var(--display);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-top: var(--step-2);
}
.hero-body { font-size: 16px; color: var(--ink-2); margin: 0; max-width: 62ch; }
.hero-body strong { color: var(--ink); font-weight: 600; }

/* ---------- stat tiles ---------- */
.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: var(--step-3);
}
.tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: var(--step-4);
  display: flex;
  flex-direction: column;
  gap: var(--step-1);
  min-width: 0;
}
.tile-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-muted);
  letter-spacing: 0.01em;
}
.tile-value {
  font-family: var(--display);
  font-size: 30px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.1;
}
.tile-note { font-size: 12.5px; color: var(--ink-2); }

/* ---------- sections & cards ---------- */
section { display: flex; flex-direction: column; gap: var(--step-4); }
.section-head { display: flex; flex-direction: column; gap: var(--step-1); }
h2 {
  font-family: var(--display);
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0;
}
.section-sub { font-size: 14px; color: var(--ink-2); margin: 0; max-width: 72ch; }

.grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
  gap: var(--step-3);
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: var(--step-4) var(--step-4) var(--step-3);
  display: flex;
  flex-direction: column;
  gap: var(--step-3);
  min-width: 0;
}
.card-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--step-3);
}
.card-title {
  font-family: var(--display);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.005em;
}
.card-sub { font-size: 12.5px; color: var(--ink-muted); margin: -8px 0 0; }

.toggle {
  font-family: var(--sans);
  font-size: 11.5px;
  font-weight: 500;
  color: var(--ink-2);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 3px 10px;
  cursor: pointer;
  flex: none;
}
.toggle:hover { background: var(--surface-sunk); color: var(--ink); }
.toggle[aria-pressed="true"] { background: var(--surface-sunk); color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

.plot { width: 100%; }
.plot svg { display: block; width: 100%; height: auto; overflow: visible; }
[hidden] { display: none !important; }

/* ---------- legend ---------- */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--step-2) var(--step-4);
  font-size: 12.5px;
  color: var(--ink-2);
}
.legend-item { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
.swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; }
.legend-count { color: var(--ink-muted); font-variant-numeric: tabular-nums; }

/* ---------- tables ---------- */
.table-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
caption {
  text-align: left;
  font-size: 12.5px;
  color: var(--ink-muted);
  padding-bottom: var(--step-2);
}
th {
  text-align: left;
  font-family: var(--display);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-muted);
  padding: 0 var(--step-3) var(--step-2) 0;
  border-bottom: 1px solid var(--grid);
  white-space: nowrap;
}
td {
  padding: 7px var(--step-3) 7px 0;
  border-bottom: 1px solid var(--grid);
  color: var(--ink-2);
  vertical-align: top;
}
tbody tr:last-child td { border-bottom: none; }
td:first-child, th:first-child { padding-left: 0; }
.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
.path {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink);
  overflow-wrap: anywhere;
  max-width: 42ch;
  display: inline-block;
}
.key { font-family: var(--mono); font-size: 12px; color: var(--ink); }

/* severity stripe: form as well as color, per the status rule */
.sev { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.sev-dot { width: 9px; height: 9px; border-radius: 2px; flex: none; }

/* ---------- next steps ---------- */
.steps { list-style: none; margin: 0; padding: 0; counter-reset: step; display: flex; flex-direction: column; gap: var(--step-3); }
.steps li {
  counter-increment: step;
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr);
  gap: var(--step-3);
  padding: var(--step-4);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 14.5px;
  color: var(--ink-2);
}
.steps li::before {
  content: counter(step);
  font-family: var(--display);
  font-weight: 700;
  font-size: 13px;
  color: var(--accent);
  border: 1px solid var(--border);
  border-radius: 7px;
  width: 30px;
  height: 26px;
  display: grid;
  place-items: center;
}
.steps b { color: var(--ink); font-weight: 600; }

footer {
  font-size: 12.5px;
  color: var(--ink-muted);
  border-top: 1px solid var(--grid);
  padding-top: var(--step-4);
}
footer code { font-family: var(--mono); font-size: 12px; }

/* ---------- tooltip ---------- */
#tip {
  position: fixed;
  z-index: 50;
  pointer-events: none;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 7px 10px;
  font-size: 12.5px;
  line-height: 1.45;
  box-shadow: 0 6px 22px rgba(0, 0, 0, 0.14);
  max-width: 280px;
  opacity: 0;
  transition: opacity 90ms linear;
}
#tip[data-show="1"] { opacity: 1; }
#tip .tip-key { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); display: block; overflow-wrap: anywhere; }
#tip .tip-val { font-weight: 600; }

.bar-hit { fill: transparent; cursor: default; }
.bar-hit:hover + .bar-mark, .bar-row:hover .bar-mark { opacity: 0.82; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
@media (max-width: 620px) {
  .hero { grid-template-columns: minmax(0, 1fr); padding: var(--step-5); }
  .wrap { padding-block: var(--step-5) var(--step-6); gap: var(--step-5); }
}
</style>

<div class="wrap" id="app"></div>
<div id="tip" role="status" aria-live="polite"></div>

<script id="payload" type="application/json">__DATA__</script>
<script>
(function () {
  "use strict";

  var PAYLOAD = JSON.parse(document.getElementById("payload").textContent);
  var S = PAYLOAD.summary;
  var STEPS = PAYLOAD.steps || [];
  var app = document.getElementById("app");
  var tip = document.getElementById("tip");

  // ---------- formatting ----------
  function num(n) { return (n == null ? 0 : n).toLocaleString("en-US"); }
  function pct(part, whole) { return whole ? (100 * part / whole).toFixed(1) + "%" : "0.0%"; }
  function bytes(b) {
    b = b || 0;
    if (b >= 1024 * 1024 * 1024) return (b / 1073741824).toFixed(2) + " GB";
    if (b >= 1024 * 1024) return (b / 1048576).toFixed(1) + " MB";
    if (b >= 1024) return (b / 1024).toFixed(1) + " KB";
    return b + " B";
  }
  function compact(n) {
    n = n || 0;
    if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, "") + "B";
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
    if (n >= 1e4) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
    return num(n);
  }
  function titleise(s) {
    return String(s).replace(/_/g, " ").replace(/^\w/, function (c) { return c.toUpperCase(); });
  }
  function lookup(list, key) {
    for (var i = 0; i < (list || []).length; i++) if (list[i].key === key) return list[i].count;
    return 0;
  }
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }
  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  var TOTAL = S.inventory.total_files || 0;

  // ---------- tooltip ----------
  function showTip(evt, label, value) {
    tip.innerHTML = "";
    var k = el("span", "tip-key", label);
    var v = el("span", "tip-val", value);
    tip.appendChild(k); tip.appendChild(v);
    tip.setAttribute("data-show", "1");
    moveTip(evt);
  }
  function moveTip(evt) {
    var pad = 14;
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var x = evt.clientX + pad, y = evt.clientY + pad;
    if (x + w > window.innerWidth - 8) x = evt.clientX - w - pad;
    if (y + h > window.innerHeight - 8) y = evt.clientY - h - pad;
    tip.style.left = Math.max(8, x) + "px";
    tip.style.top = Math.max(8, y) + "px";
  }
  function hideTip() { tip.setAttribute("data-show", "0"); }

  function bindTip(node, label, value) {
    node.addEventListener("mouseenter", function (e) { showTip(e, label, value); });
    node.addEventListener("mousemove", moveTip);
    node.addEventListener("mouseleave", hideTip);
    node.addEventListener("focus", function () {
      var r = node.getBoundingClientRect();
      showTip({ clientX: r.left + r.width / 2, clientY: r.top }, label, value);
    });
    node.addEventListener("blur", hideTip);
  }

  // ---------- svg helpers ----------
  var NS = "http://www.w3.org/2000/svg";
  function svgEl(tag, attrs) {
    var node = document.createElementNS(NS, tag);
    for (var k in attrs) if (attrs[k] != null) node.setAttribute(k, attrs[k]);
    return node;
  }
  // Rect with two rounded corners on the data end, square at the baseline.
  function barPath(x, y, w, h, r, side) {
    r = Math.max(0, Math.min(r, h / 2, w));
    if (w <= 0.5 || h <= 0) return "M" + x + " " + y + "h" + Math.max(w, 0) + "v" + h + "h" + -Math.max(w, 0) + "Z";
    if (side === "right") {
      return "M" + x + " " + y + "H" + (x + w - r) + "a" + r + " " + r + " 0 0 1 " + r + " " + r +
             "V" + (y + h - r) + "a" + r + " " + r + " 0 0 1 " + -r + " " + r + "H" + x + "Z";
    }
    return "M" + x + " " + (y + h) + "V" + (y + r) + "a" + r + " " + r + " 0 0 1 " + r + " " + -r +
           "H" + (x + w - r) + "a" + r + " " + r + " 0 0 1 " + r + " " + r + "V" + (y + h) + "Z";
  }

  // ---------- card scaffold with chart / table twin ----------
  var cardSeq = 0;
  function makeCard(title, sub) {
    var card = el("div", "card");
    var head = el("div", "card-head");
    head.appendChild(el("div", "card-title", title));
    var btn = el("button", "toggle", "Table");
    btn.type = "button";
    btn.setAttribute("aria-pressed", "false");
    head.appendChild(btn);
    card.appendChild(head);
    if (sub) card.appendChild(el("p", "card-sub", sub));

    var plot = el("div", "plot");
    var tableWrap = el("div", "table-scroll");
    tableWrap.hidden = true;
    var plotId = "plot-" + (++cardSeq);
    plot.id = plotId;
    tableWrap.id = plotId + "-table";
    btn.setAttribute("aria-controls", plotId + " " + tableWrap.id);
    card.appendChild(plot);
    card.appendChild(tableWrap);

    btn.addEventListener("click", function () {
      var showTable = plot.hidden === false;
      plot.hidden = showTable;
      tableWrap.hidden = !showTable;
      btn.setAttribute("aria-pressed", String(showTable));
      btn.textContent = showTable ? "Chart" : "Table";
      hideTip();
    });
    return { card: card, plot: plot, table: tableWrap };
  }

  function buildTable(headers, rows, caption) {
    var table = el("table");
    if (caption) table.appendChild(el("caption", null, caption));
    var thead = el("thead"), tr = el("tr");
    headers.forEach(function (h, i) {
      var th = el("th", i > 0 ? "num" : null, h.label != null ? h.label : h);
      if (i > 0) th.style.textAlign = "right";
      tr.appendChild(th);
    });
    thead.appendChild(tr);
    table.appendChild(thead);
    var tbody = el("tbody");
    rows.forEach(function (row) {
      var line = el("tr");
      row.forEach(function (cell, i) {
        var td = el("td", i > 0 ? "num" : null);
        if (cell && cell.nodeType) td.appendChild(cell);
        else td.textContent = cell == null ? "—" : cell;
        line.appendChild(td);
      });
      tbody.appendChild(line);
    });
    table.appendChild(tbody);
    return table;
  }

  // ---------- horizontal bars, single hue ----------
  function hbars(target, rows, opts) {
    opts = opts || {};
    var fmt = opts.format || num;
    var color = opts.color || "var(--accent)";
    var rowH = 26, barH = 16, gap = 10, labelW = opts.labelW || 150;
    var width = 560, right = 58;
    var plotW = width - labelW - right;
    var max = Math.max.apply(null, rows.map(function (r) { return r.value; }).concat([1]));
    var height = rows.length * (rowH + gap) - gap + 4;

    var svg = svgEl("svg", {
      viewBox: "0 0 " + width + " " + Math.max(height, 10),
      role: "img", "aria-label": opts.aria || "Bar chart"
    });

    rows.forEach(function (row, i) {
      var y = i * (rowH + gap);
      var w = max ? (row.value / max) * plotW : 0;
      var g = svgEl("g", { class: "bar-row", tabindex: "0", role: "listitem" });

      var label = svgEl("text", {
        x: labelW - 10, y: y + barH / 2 + 5, "text-anchor": "end",
        fill: "var(--ink-2)", "font-size": "12.5", "font-family": "var(--sans)"
      });
      label.textContent = row.label.length > 22 ? row.label.slice(0, 21) + "…" : row.label;
      g.appendChild(label);

      g.appendChild(svgEl("path", {
        d: barPath(labelW, y, Math.max(w, 2), barH, 4, "right"),
        fill: color, class: "bar-mark"
      }));

      var value = svgEl("text", {
        x: labelW + Math.max(w, 2) + 8, y: y + barH / 2 + 5,
        fill: "var(--ink)", "font-size": "12", "font-family": "var(--sans)",
        "font-variant-numeric": "tabular-nums"
      });
      value.textContent = fmt(row.value);
      g.appendChild(value);

      g.appendChild(svgEl("rect", {
        x: 0, y: y - 4, width: width, height: barH + 8, class: "bar-hit"
      }));
      bindTip(g, row.label, fmt(row.value) + (row.note ? " · " + row.note : ""));
      svg.appendChild(g);
    });

    target.plot.appendChild(svg);
    target.table.appendChild(buildTable(
      [opts.labelHeader || "Item", opts.valueHeader || "Value"],
      rows.map(function (r) { return [r.label, fmt(r.value)]; })
    ));
  }

  // ---------- vertical columns, single hue ----------
  function columns(target, rows, opts) {
    opts = opts || {};
    var fmt = opts.format || num;
    var width = 560, height = 210, top = 22, bottom = 46, left = 6, right = 6;
    var plotH = height - top - bottom;
    var slot = (width - left - right) / rows.length;
    var barW = Math.min(24, slot * 0.46);
    var max = Math.max.apply(null, rows.map(function (r) { return r.value; }).concat([1]));

    var svg = svgEl("svg", { viewBox: "0 0 " + width + " " + height, role: "img", "aria-label": opts.aria || "Column chart" });
    svg.appendChild(svgEl("line", {
      x1: left, y1: top + plotH, x2: width - right, y2: top + plotH,
      stroke: "var(--axis)", "stroke-width": 1
    }));

    rows.forEach(function (row, i) {
      var cx = left + slot * i + slot / 2;
      var h = max ? (row.value / max) * plotH : 0;
      if (row.value > 0) h = Math.max(h, 3);

  // ---------- one stacked bar + legend ----------
  function stackedBar(mountPlot, mountLegend, mountTable, segments, totalCount) {
    var width = 1000, barH = 46, gapPx = 2;
    var shown = segments.filter(function (s) { return s.value > 0; });
    var sum = shown.reduce(function (a, s) { return a + s.value; }, 0) || 1;
    var gapTotal = gapPx * Math.max(shown.length - 1, 0);
    var usable = width - gapTotal;

    var svg = svgEl("svg", {
      viewBox: "0 0 " + width + " " + barH, preserveAspectRatio: "none",
      role: "img", "aria-label": "Estate disposition breakdown"
    });
    svg.style.height = barH + "px";

    var x = 0;
    shown.forEach(function (seg, i) {
      var w = (seg.value / sum) * usable;
      var g = svgEl("g", { class: "bar-row", tabindex: "0" });
      var isFirst = i === 0, isLast = i === shown.length - 1;
      var r = 4;
      var d;
      if (isFirst && isLast) d = barPath(x, 0, w, barH, r, "right");
      else if (isFirst) d = "M" + (x + r) + " 0H" + (x + w) + "V" + barH + "H" + (x + r) +
                            "a" + r + " " + r + " 0 0 1 " + -r + " " + -r + "V" + r +
                            "a" + r + " " + r + " 0 0 1 " + r + " " + -r + "Z";
      else if (isLast) d = barPath(x, 0, w, barH, r, "right");
      else d = "M" + x + " 0h" + w + "v" + barH + "h" + -w + "Z";

      g.appendChild(svgEl("path", { d: d, fill: seg.color, class: "bar-mark" }));
      bindTip(g, seg.label, num(seg.value) + " files · " + pct(seg.value, totalCount));
      svg.appendChild(g);
      x += w + gapPx;
    });

    mountPlot.appendChild(svg);

    segments.forEach(function (seg) {
      var item = el("div", "legend-item");
      var sw = el("span", "swatch");
      sw.style.background = seg.color;
      item.appendChild(sw);
      item.appendChild(el("span", null, seg.label));
      item.appendChild(el("span", "legend-count", num(seg.value) + " · " + pct(seg.value, totalCount)));
      mountLegend.appendChild(item);
    });

      ["Disposition", "Files", "Share"],
      segments.map(function (s) { return [s.label, num(s.value), pct(s.value, totalCount)]; })
    ));

  // --- duplication ---
  var dupSection = el("section");
  var duph = el("div", "section-head");
  duph.appendChild(el("h2", null, "Duplication"));
  duph.appendChild(el("p", "section-sub",
    "Exact duplicates share a content hash. Near-duplicates are clustered by SimHash over text shingles — the \"FINAL v3 (copy)\" problem that makes a RAG corpus answer the same question three ways."));
  dupSection.appendChild(duph);

  var dupTiles = el("div", "kpis");
  [
    { label: "Exact duplicate groups", value: num(S.duplication.exact_groups), note: "identical content" },
    { label: "Near-duplicate clusters", value: num(S.duplication.near_groups), note: "same document, edited" },
    { label: "Redundant files", value: num(S.duplication.duplicate_files), note: S.duplication.duplicate_pct + "% of the estate" },
    { label: "Storage recoverable", value: bytes(S.duplication.redundant_bytes), note: S.duplication.reclaimable_pct + "% of total bytes" }
  ].forEach(function (k) {
    var tile = el("div", "tile");
    tile.appendChild(el("div", "tile-label", k.label));
    tile.appendChild(el("div", "tile-value", k.value));
    tile.appendChild(el("div", "tile-note", k.note));
    dupTiles.appendChild(tile);
  });
  dupSection.appendChild(dupTiles);

  function groupTable(title, groups, isNear) {
    var card = el("div", "card");
    var head = el("div", "card-head");
    head.appendChild(el("div", "card-title", title));
    card.appendChild(head);
    var scroll = el("div", "table-scroll");
    if (!groups.length) {
      card.appendChild(el("p", "card-sub", "None found."));
      return card;
    }
    var headers = isNear ? ["Keeper", "Copies", "Similarity", "Wasted"] : ["Keeper", "Copies", "Wasted"];
    scroll.appendChild(buildTable(headers, groups.slice(0, 8).map(function (g) {
      var keeper = el("span", "path", String(g.keeper).split("/").pop());
      return isNear
        ? [keeper, num(g.members), Math.round(g.similarity * 100) + "%", bytes(g.redundant_bytes)]
        : [keeper, num(g.members), bytes(g.redundant_bytes)];
    })));
    card.appendChild(scroll);
    return card;
  }
  var dupGrid = el("div", "grid-2");
  dupGrid.appendChild(groupTable("Largest exact-duplicate groups", S.duplication.top_exact_groups || [], false));
  dupGrid.appendChild(groupTable("Largest near-duplicate clusters", S.duplication.top_near_groups || [], true));
  dupSection.appendChild(dupGrid);
  app.appendChild(dupSection);

  // --- folder hotspots ---
  var hotspots = S.inventory.folder_hotspots || [];
  if (hotspots.length) {
    var hotSection = el("section");
    var hoth = el("div", "section-head");
    hoth.appendChild(el("h2", null, "Where the estate actually lives"));
    hoth.appendChild(el("p", "section-sub", "Folders by byte volume, with the highest sensitivity score found inside each."));
    hotSection.appendChild(hoth);
    var hotCard = el("div", "card");
    var hotScroll = el("div", "table-scroll");
    hotScroll.appendChild(buildTable(
      ["Folder", "Files", "Size", "Peak sensitivity"],
      hotspots.slice(0, 10).map(function (h) {
        return [el("span", "path", h.folder), num(h.files), bytes(h.bytes), num(h.max_sensitivity)];
      })
    ));
    hotCard.appendChild(hotScroll);
    hotSection.appendChild(hotCard);
    app.appendChild(hotSection);
  }

  // --- next steps ---
  if (STEPS.length) {
    var stepSection = el("section");
    var steph = el("div", "section-head");
    steph.appendChild(el("h2", null, "Recommended sequence"));
    steph.appendChild(el("p", "section-sub", "Ordered by what blocks the migration first, not by effort."));
    stepSection.appendChild(steph);
    var list = el("ol", "steps");
    STEPS.forEach(function (text) {
      var li = el("li");
      var idx = text.indexOf(".");
      if (idx > 0 && idx < 120) {
        li.appendChild(el("b", null, text.slice(0, idx + 1) + " "));
        li.appendChild(document.createTextNode(text.slice(idx + 1).trim()));
      } else {
        li.textContent = text;
      }
      list.appendChild(li);
    });
    stepSection.appendChild(list);
    app.appendChild(stepSection);
  }

  // --- footer ---
  var foot = el("footer");
  foot.textContent = "Generated by the Unstructured Data Profiler Agent · run " + S.run_id +
    " · per-file detail for all " + num(TOTAL) + " files is in manifest.jsonl" +
    (S.scan.truncated ? " · crawl hit its max_files ceiling of " + num(S.scan.max_files) + ", so figures describe the scanned subset" : "");
  app.appendChild(foot);

  window.addEventListener("scroll", hideTip, { passive: true });
})();
</script>
